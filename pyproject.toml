[project]
name = "microduck-cat-vision"
version = "0.1.0"
description = "Local Nooby/Jaina recognition and Microduck simulator integration"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "imagehash>=4.3,<5",
  "numpy>=2,<3",
  "onnx>=1.19,<2",
  "onnxruntime>=1.23,<2",
  "onnxslim>=0.1.82,<1",
  "pillow>=11,<13",
  "python-multipart>=0.0.20,<1",
  "ultralytics>=8.3,<9",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
microduck-prepare = "microduck_cat_vision.prepare:main"
microduck-train = "microduck_cat_vision.train:main"
microduck-serve = "microduck_cat_vision.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/microduck_cat_vision"]
